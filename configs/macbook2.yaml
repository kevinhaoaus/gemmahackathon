# SwarmMind node config: MacBook Air (Apple Silicon, macOS), Ollama + gemma4:e4b.
# One file per MacBook: copy this file (macbook3.yaml, ...) and change node_id, rank and static_peers.
# Every key must be a NodeConfig field (swarmmind/config.py); unknown keys are an error.
# Run: .venv/bin/python -m swarmmind.agent --config configs/macbook2.yaml

# --- identity ---------------------------------------------------------------
node_id: macbook2        # unique per file (macbook, macbook2, macbook3, ...)
rank: 70                 # MacBooks use 60-80: below Thor (200) and the Legion (100), above the Pi (50)
host_ip: ""                # IP advertised to peers; "" = auto-detect the LAN IP
http_port: 8700            # HTTP API + dashboard + /ws/peer + /ws/ui + /ws/topics
bind_host: "0.0.0.0"       # listen on all interfaces

# --- inference (local only) -------------------------------------------------
backend: ollama            # Ollama for macOS (Metal); model copied over the LAN, never pulled
ollama_url: "http://127.0.0.1:11434"   # this node's own Ollama; peers never call it
model: "gemma4:e4b"        # must match `ollama list` on this Mac
litert_model_path: ""      # unused with backend: ollama
litert_backend: cpu        # unused with backend: ollama
model_supports_images: true  # gemma4:e4b is multimodal
num_predict: 512           # max tokens per answer (a handoff continues within the same budget)

# --- vision -----------------------------------------------------------------
vision_mode: native        # the LLM sees the image itself
detector_model: ""         # no EdgeTPU
detector_model_cpu: ""     # optional plain .tflite detector; "" = none
detector_labels: ""        # COCO labels for the optional detector
# Snapshot URL: http(s)://.../shot.jpg, file:<path>, mock:, or "" for none.
# 192.168.1.50 = the Android IP Webcam phone; replace it, or "" if this node has no camera.
camera_url: "http://192.168.1.50:8080/shot.jpg"

# --- network (LAN only) -----------------------------------------------------
# Plan: thor .30, legion .36, pi .40, macbook .41, macbook2 .42 (this file: .42). Replace with your IPs.
static_peers: ["192.168.1.30:8700", "192.168.1.36:8700", "192.168.1.40:8700", "192.168.1.41:8700"]
udp_port: 50000            # heartbeat/discovery port
broadcast_addr: "255.255.255.255"   # "" disables broadcast (static_peers only)
heartbeat_interval: 0.2    # seconds between heartbeats
peer_timeout: 0.6          # seconds without a heartbeat before a peer is dead
health_interval: 0.5       # seconds between local LLM health checks
health_window: 2.0         # healthy = own LLM answered a check within this window
takeover_stable_s: 3.0     # stability required before preempting a healthy leader
startup_grace_s: 1.0       # listen this long before claiming leadership

# --- task bus ---------------------------------------------------------------
capabilities: []           # add "arm.so101" if the SO-101's USB cable is plugged into this Mac
capability_config:   # e.g. {"arm.so101": {"port": "/dev/tty.usbmodem5A460829821", "mock": false}}; plus the shared cell block
  # robot cell / LabMate layout (docs/ROBOT_CELL.md, docs/LABMATE.md): IDENTICAL on every node, so any
  # leader can run LabMate. Measure tag_size_m and table_tags on the real bench (metres, table frame).
  cell:
    tag_size_m: 0.05                   # black square, measured 5.0 cm (image-inferred 4.96 cm)
    # real bench: rectangle 25 x 20 in between OUTSIDE corners, tags 5 cm -> centres 0.585 x 0.458 m.
    # Right-handed, seen from above: origin tag 0, x toward tag 3, y toward tag 1. Tags lie rotated (yaw -90).
    table_tags: {0: [0.0, 0.0, -90.0], 3: [0.458, 0.0, -90.0], 1: [0.0, 0.585, -90.0], 2: [0.458, 0.585, -90.0]}
    objects:
      # The printed sheet has only tags 0-3 (bench corners), 10 and 11 (plus loose copies of 0 and 3),
      # not the 30/31 of docs/LABMATE.md, so the real bench maps safe_tray -> tag 10, handover -> tag 11.
      # The point is 7 cm from its tag so an item set down there never covers the tag.
      safe_tray: {tag: 10, kind: fixture, offset: [0.07, 0.0, 0.0]}     # hazards go here
      handover:  {tag: 11, kind: fixture, offset: [0.07, 0.0, 0.0]}     # fetched items go here
    catalog:                           # LabMate (docs/LABMATE.md): everything Gemma may name. IDENTICAL on every node
      items:                           # height = grip height above the table (m); grasp: across = across the long axis, none = never picked
        screwdriver:    {kind: tool,       height: 0.012, grasp: across}
        file:           {kind: tool,       height: 0.008, grasp: across}
        spring:         {kind: part,       height: 0.010, grasp: center}
        superglue:      {kind: consumable, height: 0.060, grasp: center}
        stepper_motor:  {kind: part,       height: 0.030, grasp: center}
        motor_driver:   {kind: part,       height: 0.015, grasp: center}
        power_supply:   {kind: equipment,  height: 0.050, grasp: none}
        multimeter:     {kind: tool,       height: 0.030, grasp: center}
        ruler:          {kind: tool,       height: 0.003, grasp: across}
        stand:          {kind: equipment,  height: 0.200, grasp: none}
      hazards:                         # the 7 fixed types; movable = the arm may relocate it, else report only
        open_container:    {movable: true,  severity: 3, fix: "cap it and move it away from electronics"}
        item_near_edge:    {movable: true,  severity: 2, fix: "move it back from the bench edge"}
        sharp_tool_loose:  {movable: true,  severity: 2, fix: "store the tool, tip away from people"}
        clutter_in_path:   {movable: true,  severity: 1, fix: "clear the arm's working area"}
        cable_near_motion: {movable: false, severity: 3, fix: "route the cable away from moving parts"}
        hot_tool:          {movable: false, severity: 4, fix: "let it cool on its stand; do not touch"}
        spill:             {movable: false, severity: 4, fix: "stop and clean the spill before power-on"}
      use_cases:                       # experiments LabMate knows; anything else gets general notes only
        spring_pendulum: {title: "Spring pendulum",    needs: [spring, stand, ruler],                                     optional: [multimeter]}
        stepper_test:    {title: "Stepper motor test", needs: [stepper_motor, motor_driver, power_supply, screwdriver], optional: [multimeter]}
        deburring:       {title: "Filing / deburring", needs: [file],                                                     optional: [screwdriver]}
    labmate:                           # LabMate timing / geometry (defaults shown)
      confirm_s: 5.0                   # announce a hazard move, then wait this long for POST /cell/plans/{id}/cancel
      pass_gap_s: 1.0                  # the two labelling passes use camera frames at least this far apart
      label_max_age_s: 10.0            # /lab/fetch re-labels when the agreed labels are older than this
      tray_radius_m: 0.06              # a blob this close to the safe_tray point counts as inside the tray
      slot_m: 0.035                    # spacing of per-item drop points so items in the tray don't stack
      min_use_case_score: 0.5          # below this the experiment is "unknown" (general notes only)

# --- store-and-forward uplink (LAN base station, never cloud) ---------------
uplink_urls: ["http://192.168.1.36:8800/reports"]   # base station sink; replace the IP
uplink_interval: 5.0       # seconds between flush attempts (leader only)
data_dir: data             # persisted under data/<node_id>/
log_level: INFO            # DEBUG | INFO | WARNING
