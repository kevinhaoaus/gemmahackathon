# Simulator node sim_a (one machine): mock LLM on :11501 @ 12 tok/s. Launched by scripts/simulate.py.
node_id: sim_a
rank: 100
host_ip: 127.0.0.1
bind_host: 127.0.0.1
http_port: 8701
backend: ollama
ollama_url: http://127.0.0.1:11501
model: gemma4:e4b
vision_mode: native
camera_url: "mock:"
# the other two sim nodes as "host:http_port:udp_port"; broadcast off so sims stay local
static_peers: ["127.0.0.1:8702:50002", "127.0.0.1:8703:50003"]
udp_port: 50001
broadcast_addr: ""
data_dir: data/sim
num_predict: 320    # room for a full JSON plan (up to 12 steps)
# robot cell: this node is the camera node (synthetic AprilTag scene, publishes cell.state)
capabilities: ["vision.cell"]
capability_config:
  vision.cell: {source: mock, rate_hz: 2}
  # robot cell layout (docs/ROBOT_CELL.md): identical on every node, so any leader can plan
  cell:
    tag_size_m: 0.04                   # printed black-square edge length
    table_tags: {0: [0.0, 0.0], 1: [0.60, 0.0], 2: [0.60, 0.40], 3: [0.0, 0.40]}   # id: [x, y] metres, table frame
    objects:                           # everything Gemma may name; each anchored to a tag
      servo_1:      {tag: 10, kind: part,    offset: [0.0, 0.0, 0.015], grasp_yaw: 0}
      so101_slot_1: {tag: 20, kind: slot,    offset: [0.07, 0.0, 0.03], insert_depth: 0.02}   # slot point 7 cm from its tag: a seated part must not cover the tag
      tray_a:       {tag: 11, kind: fixture, offset: [0.0, 0.0, 0.0]}
    arms:                              # table frame -> arm base frame (x, y, yaw_deg, z_table)
      arm.big: {base: [0.30, -0.25, 90.0, 0.0], approach_h: 0.08, speed: 0.05}
